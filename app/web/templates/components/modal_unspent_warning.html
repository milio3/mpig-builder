<!-- Modal de Advertencia: Puntos sin Asignar -->
<div id="modal_unspent_warning" class="modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal_unspent_title">
  <div class="modal-box modal-box-md border-amber">
    <div class="modal-header">
      <div class="modal-title-cluster">
        <div class="modal-icon-badge modal-icon-amber" aria-hidden="true">
          <svg class="tw-modal-icon" aria-hidden="true"><use href="#icon-warning"></use></svg>
        </div>
        <div>
          <h3 id="modal_unspent_title" class="modal-title text-amber" data-i18n="modal_unspent_title">Puntos de Talento Disponibles</h3>
          <span class="modal-subtitle" data-i18n="modal_unspent_sub">Hay héroes en la party que aún tienen puntos sin invertir</span>
        </div>
      </div>
      <button type="button" class="btn-modal-close" onclick="dismissUnspentWarningModal()" aria-label="Cerrar modal">
        <svg class="tw-close-icon" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>

    <div class="modal-body">
      <p class="modal-desc-txt" data-i18n="modal_unspent_desc">
        Para optimizar al máximo tu build, se recomienda gastar todos los puntos disponibles antes de guardarla o exportarla:
      </p>

      <div id="unspent_warning_list" class="unspent-heroes-tactical-list">
        <!-- Inyectado dinámicamente con los héroes y sus puntos restantes -->
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-rpg btn-rpg-secondary" onclick="dismissUnspentWarningModal()" data-i18n="btn_back_assign">
          Volver y Asignar
        </button>
        <button type="button" class="btn-rpg btn-rpg-important-gold" onclick="autoAssignAndProceed()">
          <svg class="tw-icon-sm" aria-hidden="true">
            <use href="#icon-bolt"></use>
          </svg>
          <span data-i18n="btn_auto_assign_proceed">Auto-Asignar y Continuar</span>
        </button>
        <button type="button" class="btn-rpg btn-rpg-secondary" onclick="forceProceedAction()" data-i18n="btn_ignore_proceed">
          Continuar de Todos Modos
        </button>
      </div>
    </div>
  </div>
</div>
