<!-- Modal de Advertencia de Puntos sin Asignar -->
<div id="modal_unspent_warning" class="modal-backdrop" style="display: none;">
  <div class="modal-box" style="max-width: 540px; border-color: #f59e0b;">
    <div style="display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.75rem;">
      <span style="font-size: 1.6rem; line-height: 1;">⚠️</span>
      <h3 style="color: #fde68a; font-size: 1.15rem; margin: 0; font-weight: 800;">
        Puntos de Habilidad sin Asignar
      </h3>
    </div>
    <p style="font-size: 0.88rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 0.85rem;">
      Aún tienes puntos de habilidad disponibles que no has invertido en tu grupo:
    </p>
    <div id="unspent_warning_list" class="unspent-warning-box">
      <!-- Inyectado dinámicamente -->
    </div>
    <div style="display: flex; justify-content: flex-end; gap: 0.5rem; flex-wrap: wrap;">
      <button class="btn btn-outline" onclick="closeUnspentWarningModal()">Volver y Asignar</button>
      <button class="btn-tailwind-amber-solid" onclick="autoAssignAndProceed()">
        <svg class="tw-icon" fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" clip-rule="evenodd" />
        </svg>
        <span>Auto-Asignar y Continuar</span>
      </button>
      <button class="btn-tailwind-indigo" onclick="forceProceedAction()">
        Continuar de Todos Modos
      </button>
    </div>
  </div>
</div>
