<!-- Modal para Guardar Build en la Base de Datos SQLite -->
<div id="modal_save_build" class="modal-backdrop" style="display: none;">
  <div class="modal-box" style="max-width: 520px;">
    <div class="modal-header">
      <h3 style="display: flex; align-items: center; gap: 0.5rem; margin: 0; color: #34d399; font-size: 1.15rem; font-weight: 800;">
        <svg class="tw-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 5.625c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
        </svg>
        <span>Guardar Build en Base de Datos</span>
      </h3>
      <button class="btn-modal-close" onclick="closeSaveBuildModal()">&times;</button>
    </div>

    <form id="form_save_build" onsubmit="handleSaveBuildSubmit(event)" class="modal-body">
      <div style="margin-bottom: 0.85rem;">
        <label for="save_build_title" style="display: block; font-size: 0.82rem; font-weight: 700; color: #cbd5e1; margin-bottom: 0.35rem;">
          Título de la Build *
        </label>
        <input type="text" id="save_build_title" class="form-control" required placeholder="Ej: Build Endgame Fuego Nv.80" maxlength="120" style="width: 100%;" />
      </div>

      <div style="margin-bottom: 0.85rem;">
        <label for="save_build_desc" style="display: block; font-size: 0.82rem; font-weight: 700; color: #cbd5e1; margin-bottom: 0.35rem;">
          Descripción / Notas Tácticas (Opcional)
        </label>
        <textarea id="save_build_desc" class="form-control" rows="3" placeholder="Detalles de estrategia, roles, equipo recomendado..." maxlength="500" style="width: 100%; font-family: inherit; font-size: 0.82rem;"></textarea>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.3); padding: 0.6rem 0.85rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 1.25rem;">
        <span style="font-size: 0.8rem; color: #94a3b8;">Nivel de Grupo a Registrar:</span>
        <span style="font-size: 0.92rem; font-weight: 800; color: #38bdf8;" id="save_build_level_display">Nv. 80</span>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
        <button type="button" class="btn btn-outline" onclick="closeSaveBuildModal()">Cancelar</button>
        <button type="submit" id="btn_submit_save" class="btn-tailwind-emerald">
          <span>💾 Confirmar y Guardar</span>
        </button>
      </div>
    </form>
  </div>
</div>
