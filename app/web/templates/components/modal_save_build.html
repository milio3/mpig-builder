<!-- Modal para Guardar Build en la Base de Datos SQLite -->
<div id="modal_save_build" class="modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal_save_title">
  <div class="modal-box modal-box-md">
    <div class="modal-header">
      <div class="modal-title-cluster">
        <div class="modal-icon-badge modal-icon-emerald" aria-hidden="true">
          <svg class="tw-modal-icon" aria-hidden="true"><use href="#icon-save"></use></svg>
        </div>
        <div>
          <h3 id="modal_save_title" class="modal-title" data-i18n="modal_save_title">Guardar build</h3>
          <span class="modal-subtitle" data-i18n="modal_save_sub">Guarda y comparte tus builds</span>
        </div>
      </div>
      <button type="button" class="btn-modal-close" onclick="closeSaveBuildModal()" aria-label="Cerrar modal">
        <svg class="tw-close-icon" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>

    <form id="form_save_build" onsubmit="handleSaveBuildSubmit(event)" class="modal-body">
      <div class="modal-form-group">
        <label for="save_build_title" class="modal-label" data-i18n="modal_save_label_name">
          Nombre de la Build <span class="req-star">*</span>
        </label>
        <input type="text" id="save_build_title" class="form-control modal-input" required data-i18n-placeholder="placeholder_build_name" placeholder="Ej: Meta Endgame 80 - Fuego y Crítico" maxlength="120" />
      </div>

      <!-- Fila de Autor y Tipo de Build a la Misma Altura -->
      <div class="modal-form-row-2col">
        <!-- Campo de Autor -->
        <div class="modal-form-group">
          <label for="save_build_author" class="modal-label">
            <span data-i18n="modal_save_label_author">Autor</span> <span class="opt-tag">(<span data-i18n="modal_optional">Opcional</span>)</span>
          </label>
          <input type="text" id="save_build_author" class="form-control modal-input" data-i18n-placeholder="placeholder_build_author" placeholder="Tu nombre" maxlength="60" />
        </div>

        <!-- Selector de Tipo de Build -->
        <div class="modal-form-group">
          <label for="save_build_purpose" class="modal-label" data-i18n="modal_save_label_purpose">
            Tipo de build
          </label>
          <select id="save_build_purpose" class="modal-input modal-select modal-select-purpose purpose-opt-advance" onchange="handlePurposeSelectChange(this)">
            <option value="Avance" class="purpose-opt-advance" data-i18n="purpose_advance">Avance</option>
            <option value="Jefes" class="purpose-opt-boss" data-i18n="purpose_boss">Jefes</option>
            <option value="Farming" class="purpose-opt-farm" data-i18n="purpose_farm">Farming</option>
          </select>
        </div>
      </div>

      <div class="modal-form-group">
        <label for="save_build_desc" class="modal-label">
          <span data-i18n="modal_save_label_desc">Notas Tácticas y Estrategia</span> <span class="opt-tag">(<span data-i18n="modal_optional">Opcional</span>)</span>
        </label>
        <textarea id="save_build_desc" class="form-control modal-input modal-textarea" rows="2" data-i18n-placeholder="placeholder_build_desc" placeholder="Detalles de rotación, sinergias elementales o equipo recomendado..." maxlength="500"></textarea>
      </div>

      <!-- Resumen de Héroes y Nivel Organizado en Rejilla Táctica -->
      <div class="build-save-summary-card">
        <div class="summary-card-header">
          <span class="summary-meta-label" data-i18n="modal_save_summary_level">Nivel Registrado:</span>
          <strong class="summary-level-badge" id="save_build_level_display">NV. 80</strong>
        </div>
        <div class="summary-party-grid-5" id="save_build_party_summary">
          <!-- Inyectado dinámicamente con los 5 héroes en sus colores correspondientes -->
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-modern btn-modern-sec" onclick="closeSaveBuildModal()" data-i18n="btn_cancel">Cancelar</button>
        <button type="submit" id="btn_submit_save" class="btn-modern btn-modern-success">
          <svg class="tw-icon-sm" aria-hidden="true">
            <use href="#icon-save"></use>
          </svg>
          <span data-i18n="btn_confirm_save">Guardar build</span>
        </button>
      </div>
    </form>
  </div>
</div>
