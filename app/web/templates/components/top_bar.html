<!-- Componente: Barra Superior de Control Global -->
<header class="skills-top-bar">
  <!-- Grupo Izquierdo: Nivel Común del Grupo -->
  <div class="top-bar-level-group">
    <span class="top-bar-label">Nivel del Grupo:</span>
    <input type="number" id="common_hero_level" class="form-control form-control-top" value="80" min="1" max="100" />
    <input type="range" id="common_hero_level_range" min="1" max="100" value="80" class="top-bar-range" />
    <div class="quick-levels-group">
      <button class="btn btn-top-preset" onclick="setCommonHeroLevel(40)">40</button>
      <button class="btn btn-top-preset" onclick="setCommonHeroLevel(60)">60</button>
      <button class="btn btn-top-preset" onclick="setCommonHeroLevel(80)">80</button>
      <button class="btn btn-top-preset" onclick="setCommonHeroLevel(100)">100</button>
    </div>
  </div>

  <!-- Grupo Central: Contador de Puntos por Héroe -->
  <div class="top-bar-info-group">
    <div class="pts-badge-container">
      <span class="pts-label">Puntos por Héroe:</span>
      <span class="pts-val"><strong id="stat_points_per_hero">79</strong> pts</span>
    </div>
  </div>

  <!-- Grupo Derecho: Acciones Globales -->
  <div class="top-bar-actions-group">
    <!-- Botón Max Todo Sólido Dorado -->
    <button id="btn_max_all_skills" class="btn-tailwind-amber-solid" onclick="maxAllHeroesSkills()" title="Maximizar automáticamente puntos de todos los héroes (hasta 4 activas máx por personaje)">
      <svg class="tw-icon" fill="currentColor" viewBox="0 0 24 24">
        <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" clip-rule="evenodd" />
      </svg>
      <span>⚡ Max Todo</span>
    </button>

    <!-- Guardar en Base de Datos SQLite -->
    <button id="btn_save_db" class="btn-tailwind-emerald" onclick="openSaveBuildModal()" title="Guardar esta configuración en la base de datos">
      <svg class="tw-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 6.375c0 2.278-3.694 4.125-8.25 4.125S3.75 8.653 3.75 6.375m16.5 0c0-2.278-3.694-4.125-8.25-4.125S3.75 4.097 3.75 6.375m16.5 0v11.25c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125V6.375m16.5 5.625c0 2.278-3.694 4.125-8.25 4.125s-8.25-1.847-8.25-4.125" />
      </svg>
      <span>Guardar BD</span>
    </button>

    <!-- Cargar desde Base de Datos SQLite -->
    <button id="btn_load_db" class="btn-tailwind-cyan" onclick="openLoadBuildModal()" title="Ver y cargar builds guardadas en la base de datos">
      <svg class="tw-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776" />
      </svg>
      <span>Mis Builds</span>
    </button>

    <!-- Exportar Código / JSON -->
    <button id="btn_export_build" class="btn-tailwind-indigo" onclick="openShareModal('export')" title="Exportar configuración en JSON o código compartible">
      <svg class="tw-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
      </svg>
      <span>Exportar</span>
    </button>
    
    <!-- Importar Código / JSON -->
    <button id="btn_import_build" class="btn-tailwind-slate" onclick="openShareModal('import')" title="Importar build desde código o JSON">
      <svg class="tw-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" />
      </svg>
      <span>Importar</span>
    </button>

    <!-- Reiniciar Todo -->
    <button id="btn_reset_all_skills" class="btn-tailwind-rose" onclick="resetAllHeroesSkills()" title="Reiniciar todos los puntos de todos los héroes">
      <svg class="tw-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      <span>Reset</span>
    </button>
  </div>
</header>
