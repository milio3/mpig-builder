<!-- Componente: Cabecera Moderna Estilo MarketItems -->
<header class="app-top-header" id="app_header" role="banner" aria-label="Cabecera principal de MPiG-Builder">
  <div class="top-header-inner">
    <div class="header-brand-cluster">
      <div class="brand-crest-box" aria-hidden="true" title="MPiG-Builder">
        <svg class="tw-icon-crest" viewBox="0 0 32 32" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="logoMGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#0284c7" />
            </linearGradient>
            <linearGradient id="logoGlowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#38bdf8" />
              <stop offset="100%" stop-color="#ffffff" />
            </linearGradient>
          </defs>
          <!-- Gran 'M' monolítica de borde a borde -->
          <path d="M 1 31 L 1 2 L 10 2 L 16 15 L 22 2 L 31 2 L 31 31 L 23 31 L 23 12 L 17.5 24 L 14.5 24 L 9 12 L 9 31 Z" fill="url(#logoMGrad)" />
          <!-- Chevron de Grinding Level Up -->
          <polygon points="16,2 21.5,12 16,19 10.5,12" fill="url(#logoGlowGrad)" />
          <circle cx="16" cy="12" r="2.5" fill="#ffffff" />
        </svg>
      </div>
      <div class="brand-title-wrap">
        <h1 class="brand-title">MPiG-Builder</h1>
        <p class="brand-subtitle">
          <span data-i18n="header_subtitle_prefix">Crea y comparte tus builds de</span>
          <a href="https://store.steampowered.com/app/4952980/My_Party_Is_Grinding/" target="_blank" rel="noopener noreferrer" class="steam-game-link" data-i18n-title="steam_link_title" title="Ver My Party is Grinding en Steam">
            <svg class="tw-icon-steam" aria-hidden="true"><use href="#icon-steam"></use></svg>
            <span>My Party is Grinding</span>
          </a>
        </p>
      </div>
    </div>


    <div class="header-actions-cluster" role="toolbar" aria-label="Acciones de cabecera">
      <!-- Botón de Donación / Apoyo Ko-fi -->
      <a href='https://ko-fi.com/A0R226EJNI' target='_blank' rel="noopener noreferrer" class="kofi-header-link" title="Buy Me a Coffee at ko-fi.com">
        <img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi3.png?v=6' border='0' alt='Buy Me a Coffee at ko-fi.com' />
      </a>

      <!-- Selector de Idioma Moderno -->
      <button type="button" id="btn_lang_toggle" class="btn-modern btn-modern-lang" onclick="I18N.toggleLanguage()" data-i18n-title="lang_switch_title" title="Cambiar idioma / Change language">
        <svg class="tw-icon-sm" aria-hidden="true"><use href="#icon-lang"></use></svg>
        <span class="lang-text">ES / EN</span>
      </button>
    </div>
  </div>
</header>
