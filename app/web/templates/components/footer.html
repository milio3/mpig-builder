<!-- Componente: Pie de Página Discreto Retro MMO (Footer) -->
<footer class="skills-app-footer" id="app_footer" role="contentinfo" aria-label="Pie de página informativo de MPiG-Bulder">
  <div class="mmo-footer-inner">
    <!-- LEYENDA MODERNA CON ICONOS SVG DE TECLADO Y RATÓN -->
    <div class="mmo-footer-hints" id="footer_controls_legend" aria-label="Instrucciones de asignación de puntos">
      <!-- Clic Izquierdo: +1 nivel -->
      <span class="mmo-footer-hint-badge" data-i18n-title="hint_left_click_title" title="Un clic añade 1 punto de nivel">
        <svg class="mouse-hint-icon mouse-left" aria-hidden="true"><use href="#icon-mouse-left"></use></svg>
        <span class="hint-label" data-i18n="footer_click_left">Clic izquierdo</span>
        <span class="hint-action" data-i18n="footer_add_level">+1 nivel</span>
      </span>

      <span class="mmo-footer-hint-sep">·</span>

      <!-- Shift + Clic: Maximizar nivel -->
      <span class="mmo-footer-hint-badge" data-i18n-title="hint_shift_click_title" title="Shift + Clic asigna todos los niveles posibles">
        <kbd class="kbd-key-badge">Shift</kbd>
        <span class="hint-plus">+</span>
        <svg class="mouse-hint-icon mouse-left" aria-hidden="true"><use href="#icon-mouse-left"></use></svg>
        <span class="hint-action" data-i18n="footer_max_level">Nivel máximo</span>
      </span>

      <span class="mmo-footer-hint-sep">·</span>

      <!-- Clic Derecho: -1 nivel -->
      <span class="mmo-footer-hint-badge" data-i18n-title="hint_right_click_title" title="Clic derecho resta 1 punto de nivel">
        <svg class="mouse-hint-icon mouse-right" aria-hidden="true"><use href="#icon-mouse-right"></use></svg>
        <span class="hint-label" data-i18n="footer_click_right">Clic derecho</span>
        <span class="hint-action" data-i18n="footer_sub_level">-1 nivel</span>
      </span>
    </div>

    <!-- METADATOS LIMPIOS DEL PIE (SIN TEXTO DE BASE DE DATOS) -->
    <div class="mmo-footer-meta">
      <span class="mmo-footer-version">MPiG-Builder v1.0.0</span>
    </div>
  </div>
</footer>
