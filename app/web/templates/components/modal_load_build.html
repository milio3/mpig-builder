<!-- Modal para Listar y Cargar Builds Guardadas en SQLite -->
<div id="modal_load_build" class="modal-backdrop" style="display: none;">
  <div class="modal-box" style="max-width: 680px;">
    <div class="modal-header">
      <h3 style="display: flex; align-items: center; gap: 0.5rem; margin: 0; color: #38bdf8; font-size: 1.15rem; font-weight: 800;">
        <svg class="tw-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776" />
        </svg>
        <span>Builds Guardadas en Base de Datos</span>
      </h3>
      <button class="btn-modal-close" onclick="closeLoadBuildModal()">&times;</button>
    </div>

    <div class="modal-body">
      <p style="font-size: 0.84rem; color: #94a3b8; margin-bottom: 0.75rem;">
        Selecciona una configuración guardada para cargarla inmediatamente en el planificador:
      </p>

      <div id="saved_builds_list_container" class="saved-builds-list">
        <!-- Rellenado dinámicamente vía API -->
        <div style="text-align: center; padding: 1.5rem; color: #64748b;">
          Cargando builds desde la base de datos...
        </div>
      </div>

      <div style="display: flex; justify-content: flex-end; margin-top: 1.25rem;">
        <button type="button" class="btn btn-outline" onclick="closeLoadBuildModal()">Cerrar</button>
      </div>
    </div>
  </div>
</div>
