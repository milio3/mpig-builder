<!-- Modal para Listar y Cargar Builds Guardadas (Build Library) -->
<div id="modal_load_build" class="modal-backdrop" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="modal_load_title">
  <div class="modal-box modal-box-xl">
    <div class="modal-header">
      <div class="modal-title-cluster">
        <div class="modal-icon-badge modal-icon-cyan" aria-hidden="true">
          <svg class="tw-modal-icon" aria-hidden="true"><use href="#icon-library"></use></svg>
        </div>
        <div>
          <h3 id="modal_load_title" class="modal-title" data-i18n="modal_load_title">Biblioteca de Builds Guardadas</h3>
          <span class="modal-subtitle" data-i18n="modal_load_sub">Librería de builds de My party is Grinding</span>
        </div>
      </div>
      <button type="button" class="btn-modal-close" onclick="closeLoadBuildModal()" aria-label="Cerrar modal">
        <svg class="tw-close-icon" aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>

    <div class="modal-body">
      <!-- Barra Fija de Filtro y Búsqueda en la Biblioteca -->
      <div class="library-filter-bar">
        <div class="library-search-wrap">
          <svg class="tw-search-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
          <input type="search" id="library_search_input" class="form-control library-search-input" data-i18n-placeholder="library_search_placeholder" placeholder="Buscar build por nombre..." oninput="filterBuildsList(this.value)" />
        </div>

        <div class="library-sort-wrap">
          <select id="library_sort_select" class="library-sort-select" onchange="changeLibrarySort(this.value)" title="Filtrar u ordenar builds">
            <option value="recent" data-i18n="filter_recent" selected>Últimas builds</option>
            <option value="level_desc" data-i18n="filter_level_desc">Nivel descendente</option>
            <option value="votes" data-i18n="filter_votes">Más votadas</option>
          </select>
        </div>

        <button type="button" class="btn-modern btn-modern-sec btn-sm" onclick="openSaveBuildModalFromLibrary()" data-i18n-title="btn_save_title" title="Guardar la build actual como nueva">
          <svg class="tw-icon-sm" aria-hidden="true"><use href="#icon-plus"></use></svg>
          <span data-i18n="btn_new_build">Nueva Build</span>
        </button>
      </div>

      <!-- Contenedor Dinámico de Cards de la Biblioteca -->
      <div id="saved_builds_list_container" class="saved-builds-list">
        <!-- Renderizado dinámicamente -->
        <div class="library-loading-state">
          <div class="spinner"></div>
          <span data-i18n="library_loading">Consultando biblioteca de SQLite...</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-rpg btn-rpg-secondary" onclick="closeLoadBuildModal()" data-i18n="btn_close">Cerrar</button>
      </div>
    </div>
  </div>
</div>
